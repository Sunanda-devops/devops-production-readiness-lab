apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "production-readiness-api.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "production-readiness-api.fullname" . }}-config
data:
  APP_VERSION: {{ .Values.app.version | quote }}
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  PORT: "8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "production-readiness-api.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "production-readiness-api.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "production-readiness-api.fullname" . }}-config
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "production-readiness-api.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "production-readiness-api.fullname" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "production-readiness-api.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
