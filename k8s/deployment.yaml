apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-readiness-api
  namespace: production-rollout
  labels:
    app.kubernetes.io/name: production-readiness-api
    app.kubernetes.io/part-of: production-readiness-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: production-readiness-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: production-readiness-api
        app.kubernetes.io/part-of: production-readiness-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/sunanda-devops/production-readiness-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: production-readiness-api-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: production-readiness-api
  namespace: production-rollout
spec:
  selector:
    app.kubernetes.io/name: production-readiness-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: production-readiness-api
  namespace: production-rollout
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: production-readiness-api
